---
- name: Prepare Apache NiFi Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Apache NiFi Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure man directory exists for Java installation in containers for Apache NiFi Molecule tests preparation
      ansible.builtin.file:
        path: /usr/share/man/man1
        state: directory
        mode: "0755"
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Apache NiFi Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by the `ansible.builtin.uri` calls in verify.yml
          - python3-requests
          # Used by the `community.general.xml` tasks the role runs
          - python3-lxml
          # Provides `keytool`, which `community.general.java_keystore` and `java_cert` shell out to
          - default-jdk-headless
          # The storage driver below. Docker in a container cannot use the
          # host's overlayfs, and fuse-overlayfs is several times faster than
          # falling back to vfs.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Apache NiFi Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The Apache NiFi image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs

    # Mounted into the container through `nifi_container_additional_volumes_custom` (see molecule.yml),
    # so that verify.yml can tell whether that variable really reaches the `docker create` command
    # instead of being silently inert.
    - name: Ensure directory for the additional volume check exists for Apache NiFi Molecule tests preparation
      ansible.builtin.file:
        path: /nifi-molecule-extra
        state: directory
        mode: "0755"

    - name: Ensure marker file for the additional volume check exists for Apache NiFi Molecule tests preparation
      ansible.builtin.copy:
        content: "mounted-via-nifi_container_additional_volumes\n"
        dest: /nifi-molecule-extra/marker.txt
        mode: "0644"
