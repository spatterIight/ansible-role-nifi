---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for nifi service to become active (up to 180s)
      ansible.builtin.systemd:
        name: nifi.service
      register: nifi_service
      until: nifi_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert nifi service is active
      ansible.builtin.assert:
        that: nifi_service.status.ActiveState == 'active'
        fail_msg: "nifi.service not active ({{ nifi_service.status.ActiveState }})"
        success_msg: "nifi.service is active"

    - name: Wait for NiFi HTTPS endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "https://localhost:8443/nifi/"
        method: GET
        validate_certs: false
        status_code: [200]
        follow_redirects: none
      register: nifi_https
      until: nifi_https.status == 200
      retries: 120
      delay: 5

    - name: Assert NiFi HTTPS endpoint responds
      ansible.builtin.assert:
        that: nifi_https.status in [200, 302]
        fail_msg: "NiFi did not respond with 200 ({{ nifi_https.status | default('no response') }})"
        success_msg: "NiFi responded with 200"

    - name: Show service status summary
      ansible.builtin.debug:
        msg:
          - "nifi systemd: {{ nifi_service.status.ActiveState }}"
          - "nifi HTTPS: {{ nifi_https.status }}"
