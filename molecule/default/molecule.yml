---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: nifi-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    # Also what gives the inner Docker a /dev/fuse to hand to fuse-overlayfs.
    # See prepare.yml for why that storage driver is not the fleet's usual vfs.
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        nifi_debug_service_enabled: false

        # Variables for Apache NiFi
        nifi_uid: 1000
        nifi_gid: 1000
        nifi_hostname: localhost
        nifi_self_signed_cert_passphrase: MoleculeTestCertPass123!
        nifi_sensitive_props_key: MoleculeTestSensitiveKey123!
        nifi_login_username: molecule-admin
        nifi_login_password: MoleculeTestPassword123!
        nifi_container_labels_traefik_enabled: false

        # Deliberately not the 8443 that Apache NiFi's own image defaults to, so that reaching
        # the web interface on this port proves the role's `nifi.web.https.port` replacement
        # reached the process rather than the image's built-in default having been good enough.
        nifi_container_https_port: 9443
        nifi_container_https_host_bind_port: 9443

        # Checked in verify.yml, so that this variable cannot silently stop being rendered
        # into the `docker create` command as a `--mount` argument.
        nifi_container_additional_volumes_custom:
          - type: bind
            src: /nifi-molecule-extra
            dst: /nifi-molecule-extra
            options: readonly
  env:
    # This is a hack to resolve https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
